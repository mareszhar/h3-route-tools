name: dux

# Validate the dux workspace (@mszr/h3-dux). Scoped to dux/** so it only runs
# when our files change; the outer ci.yml treats dux as a separate workspace.
on:
  push:
    branches: [dux]
    paths: ["dux/**"]
  pull_request:
    paths: ["dux/**"]

permissions:
  contents: read

jobs:
  dux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      # dux/h3-dux/tsconfig.json path-maps `h3-route-tools` to the upstream
      # ../../src sources for type-level dev, so they need the root package's
      # own (pnpm) deps installed too — not just the dux workspace's.
      - name: Install upstream dependencies
        run: pnpm install

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        working-directory: dux
        run: bun install

      - name: Lint
        working-directory: dux
        run: bun run lint

      - name: Typecheck package
        working-directory: dux
        run: bun run sdk:typecheck

      - name: Test package
        working-directory: dux
        run: bun run sdk:test
