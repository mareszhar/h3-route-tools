name: dux

# Lint + typecheck the dux workspace (@mszr/h3-dux). Scoped to dux/** so it only
# runs when our files change; the outer ci.yml ignores dux via the ox config.
on:
  push:
    branches: [dux]
    paths: ["dux/**"]
  pull_request:
    paths: ["dux/**"]

permissions:
  contents: read

jobs:
  dux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dux
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck package
        run: bun run sdk:typecheck
